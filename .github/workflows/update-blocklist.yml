name: Update Malware Block List

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-blocklist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download hashes
        run: |
          curl -s -X POST https://mb-api.abuse.ch/api/v1/ \
            -d "query=get_recent&selector=time" \
            -o response.json
          python3 parse_hashes.py
          wc -l malware-blocklist.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add malware-blocklist.txt
          git diff --staged --quiet || git commit -m "Auto-update $(date -u)"
          git push
