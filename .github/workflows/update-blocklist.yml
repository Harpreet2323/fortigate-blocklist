name: Update Malware Block List

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-blocklist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download abuse.ch MD5 hashes
        run: |
          {
            echo "# ============================================"
            echo "# FortiGate External Malware Block List"
            echo "# Source: abuse.ch MalwareBazaar"
            echo "# Maintained by: Harpreet2323"
            echo "# Updated: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "# ============================================"
            echo ""

            curl -s --max-time 60 \
              --retry 3 \
              -X POST \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "query=get_recent&selector=time" \
              https://mb-api.abuse.ch/api/v1/ | \
            python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    if data.get('query_status') == 'ok':
        for item in data.get('data', []):
            h = item.get('md5_hash', '').strip()
            if len(h) == 32:
                print(h)
    else:
        print('# ERROR: ' + str(data.get('query_status')))
except Exception as e:
    print('# PARSE ERROR: ' + str(e))
"
          } > malware-blocklist.txt

          COUNT=$(grep -cE '^[a-fA-F0-9]{32}$' malware-blocklist.txt || echo 0)
          echo "Total hashes downloaded: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No hashes downloaded!"
            exit 1
          fi

      - name: Commit and push updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add malware-blocklist.txt
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
