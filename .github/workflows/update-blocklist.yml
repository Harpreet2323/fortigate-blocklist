name: Update Malware Block List

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-blocklist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build blocklist
        run: |
          echo "# FortiGate External Malware Block List" > malware-blocklist.txt
          echo "# Source: abuse.ch MalwareBazaar" >> malware-blocklist.txt
          echo "# Updated: $(date -u)" >> malware-blocklist.txt
          echo "" >> malware-blocklist.txt
          curl -s -X POST https://mb-api.abuse.ch/api/v1/ \
            -d "query=get_recent&selector=time" \
            -o response.json
          python3 -c "
import json
with open('response.json') as f:
    data = json.load(f)
if data.get('query_status') == 'ok':
    with open('malware-blocklist.txt', 'a') as out:
        for item in data.get('data', []):
            h = item.get('md5_hash','').strip()
            if len(h) == 32:
                out.write(h + '\n')
"
          wc -l malware-blocklist.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add malware-blocklist.txt
          git diff --staged --quiet || git commit -m "Auto-update $(date -u)"
          git push
