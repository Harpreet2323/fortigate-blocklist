name: Update Malware Block List

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours automatically
  workflow_dispatch:         # Allows manual trigger anytime

jobs:
  update-blocklist:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download abuse.ch MD5 hashes
        run: |
          echo "# ============================================" > malware-blocklist.txt
          echo "# FortiGate External Malware Block List" >> malware-blocklist.txt
          echo "# Source: abuse.ch MalwareBazaar" >> malware-blocklist.txt
          echo "# Maintained by: Harpreet2323" >> malware-blocklist.txt
          echo "# Updated: $(date -u '+%Y-%m-%d %H:%M UTC')" >> malware-blocklist.txt
          echo "# ============================================" >> malware-blocklist.txt
          echo "" >> malware-blocklist.txt
          
          curl -s https://bazaar.abuse.ch/export/txt/md5/recent/ | \
          grep -E '^[a-fA-F0-9]{32}$' >> malware-blocklist.txt
          
          echo "Total hashes: $(grep -c '^[a-fA-F0-9]' malware-blocklist.txt)"

      - name: Commit and push updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add malware-blocklist.txt
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
