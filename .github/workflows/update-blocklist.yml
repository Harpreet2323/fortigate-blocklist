name: Update Malware Block List

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-blocklist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download abuse.ch MD5 hashes
        run: |
          {
            echo "# ============================================"
            echo "# FortiGate External Malware Block List"
            echo "# Source: abuse.ch MalwareBazaar"
            echo "# Maintained by: Harpreet2323"
            echo "# Updated: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "# ============================================"
            echo ""
            curl -s --max-time 30 https://bazaar.abuse.ch/export/txt/md5/recent/ | \
            grep -E '^[a-fA-F0-9]{32}$' || true
          } > malware-blocklist.txt
          COUNT=$(grep -c '^[a-fA-F0-9]' malware-blocklist.txt || echo 0)
          echo "Total hashes downloaded: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "WARNING: No hashes downloaded - check abuse.ch connectivity"
          fi

      - name: Commit and push updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add malware-blocklist.txt
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
