name: Update Malware Block List

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-blocklist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create parser script
        run: |
          cat > parse_hashes.py << 'PYEOF'
          import sys, json
          try:
              data = json.load(sys.stdin)
              if data.get('query_status') == 'ok':
                  for item in data.get('data', []):
                      h = item.get('md5_hash', '').strip()
                      if len(h) == 32:
                          print(h)
          except Exception as e:
              print('# ERROR: ' + str(e))
          PYEOF

      - name: Download abuse.ch MD5 hashes
        run: |
          {
